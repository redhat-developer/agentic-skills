  labels:
    argo-skills-eval-fixture: "true"
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: eval-crashloop
  labels:
    argo-skills-eval-fixture: "true"
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: eval-pending
  labels:
    argo-skills-eval-fixture: "true"
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: eval-project-deny
  labels:
    argo-skills-eval-fixture: "true"
