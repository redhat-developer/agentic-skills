apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: payments-api-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    notifications.argoproj.io/subscribe.on-sync-failed.slack: payments-alerts
spec:
  project: team-payments
  source:
    repoURL: https://github.com/acme/payments-config.git
    targetRevision: v4.2.1
    path: overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: payments-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=false
      # Required alongside the ignoreDifferences block below: with ServerSideApply
      # enabled, Argo CD only honours ignoreDifferences during diffing if this is set.
      # Without it this "clean" fixture carries a real best-practice gap, and a correct
      # audit has to report one finding — which the zero-findings eval scores as a miss.
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
