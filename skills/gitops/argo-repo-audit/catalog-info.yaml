apiVersion: backstage.io/v1alpha1
kind: AiResource
metadata:
  name: argo-repo-audit
  namespace: ai5-marketplace
  title: Argo Repo Audit
  description: >
    Audit and validate Argo CD GitOps repositories by scanning local repo files (not live
    clusters) — reviews AppProject RBAC and security restrictions, checks sync policies
    and operational best practices, optionally runs schema validation, and produces a
    prioritized GitOps report. Use when users ask to audit, analyze, validate, review, or
    security-check an Argo CD GitOps repo.
  labels:
    distribution: external
  annotations:
    backstage.io/source-location: >-
      url:https://github.com/redhat-developer/agentic-skills/blob/main/skills/gitops/argo-repo-audit/SKILL.md
  tags:
    - ai-skill
    - gitops
    - argocd
  links:
    - url: https://github.com/redhat-developer/agentic-skills
      title: Source Repository
      icon: github
spec:
  type: skill
  lifecycle: beta
  owner: group:redhat/ai5-marketplace
  disciplines:
    - gitops
  categories:
    - cluster-management
  agents: []
  dependsOn:
    - airesource:ai5-marketplace/openshift-gitops
  dependencyOf: []
