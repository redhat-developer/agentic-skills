  title: Agentic Skills
  description: >
    Agent skills for Red Hat OpenShift layered products.
    Provides AI-powered GitOps workflows for OpenShift GitOps (Argo CD,
    Argo Rollouts) including knowledge, repository auditing, cluster
    debugging, and performance tuning.
  tags:
    - ai-skill
    - agentic
    - red-hat
    - openshift
  annotations:
    agentic.redhat.com/repository: https://github.com/redhat-developer/agentic-skills
    github.com/project-slug: redhat-developer/agentic-skills
spec:
  owner: group:redhat/ai5-marketplace
  dependencyOf:
    - airesource:ai5-marketplace/openshift-gitops
